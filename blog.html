    <script>
        // Bokeh Background Animation
        class BokehBackground {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.particleCount = 80;
                this.resize();
                this.init();
                this.animate();
                
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            init() {
                this.particles = [];
                for (let i = 0; i < this.particleCount; i++) {
                    this.particles.push(this.createParticle());
                }
            }

            createParticle() {
                // Full spectrum colors using HSL
                const hue = Math.random() * 360;
                const saturation = 70 + Math.random() * 30;
                const lightness = 50 + Math.random() * 20;
                
                return {
                    x: Math.random() * this.canvas.width,
                    y: Math.random() * this.canvas.height,
                    radius: Math.random() * 40 + 10,
                    hue: hue,
                    saturation: saturation,
                    lightness: lightness,
                    alpha: Math.random() * 0.4 + 0.1,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    pulse: Math.random() * Math.PI * 2,
                    pulseSpeed: 0.01 + Math.random() * 0.02
                };
            }

            drawParticle(p) {
                const pulseAlpha = p.alpha + Math.sin(p.pulse) * 0.1;
                const pulseRadius = p.radius + Math.sin(p.pulse) * 5;
                
                const gradient = this.ctx.createRadialGradient(
                    p.x, p.y, 0,
                    p.x, p.y, pulseRadius
                );
                
                gradient.addColorStop(0, `hsla(${p.hue}, ${p.saturation}%, ${p.lightness}%, ${pulseAlpha})`);
                gradient.addColorStop(0.5, `hsla(${p.hue}, ${p.saturation}%, ${p.lightness}%, ${pulseAlpha * 0.5})`);
                gradient.addColorStop(1, `hsla(${p.hue}, ${p.saturation}%, ${p.lightness}%, 0)`);
                
                this.ctx.beginPath();
                this.ctx.arc(p.x, p.y, pulseRadius, 0, Math.PI * 2);
                this.ctx.fillStyle = gradient;
                this.ctx.fill();
            }

            update() {
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.pulse += p.pulseSpeed;
                    
                    // Slowly shift hue for color animation
                    p.hue = (p.hue + 0.1) % 360;
                    
                    // Wrap around screen edges
                    if (p.x < -p.radius) p.x = this.canvas.width + p.radius;
                    if (p.x > this.canvas.width + p.radius) p.x = -p.radius;
                    if (p.y < -p.radius) p.y = this.canvas.height + p.radius;
                    if (p.y > this.canvas.height + p.radius) p.y = -p.radius;
                });
            }

            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.update();
                this.particles.forEach(p => this.drawParticle(p));
                
                requestAnimationFrame(() => this.animate());
            }
        }

        // Initialize Bokeh Background
        const bokehCanvas = document.getElementById('bokeh-canvas');

        // Scroll-triggered Animations
        class ScrollAnimator {
            constructor() {
                this.sections = document.querySelectorAll('.section-content');
                this.projectCards = document.querySelectorAll('.project-card');
                this.galleryItems = document.querySelectorAll('.gallery-item');
                this.skillTags = document.querySelectorAll('.skill-tag');
                this.nav = document.querySelector('nav');
                
                this.observerOptions = {
                    threshold: 0.2,
                    rootMargin: '0px 0px -10% 0px'
                };
                
                this.init();
            }

            init() {
                // Section observer
                const sectionObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                        } else {
                            entry.target.classList.remove('visible');
                        }
                    });
                }, this.observerOptions);

                this.sections.forEach(section => sectionObserver.observe(section));

                // Project cards observer
                const cardObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                        } else {
                            entry.target.classList.remove('visible');
                        }
                    });
                }, { threshold: 0.3 });

                this.projectCards.forEach(card => cardObserver.observe(card));

                // Gallery items observer
                const galleryObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                        } else {
                            entry.target.classList.remove('visible');
                        }
                    });
                }, { threshold: 0.2 });

                this.galleryItems.forEach(item => galleryObserver.observe(item));

                // Skill tags observer
                const skillObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                        } else {
                            entry.target.classList.remove('visible');
                        }
                    });
                }, { threshold: 0.5 });

                this.skillTags.forEach((tag, index) => {
                    tag.style.transitionDelay = `${index * 0.05}s`;
                    skillObserver.observe(tag);
                });

                // Nav scroll effect
                window.addEventListener('scroll', () => {
                    if (window.scrollY > 50) {
                        this.nav.classList.add('scrolled');
                    } else {
                        this.nav.classList.remove('scrolled');
                    }
                });

                // Trigger initial animation for hero
                setTimeout(() => {
                    document.querySelector('.hero-content').classList.add('visible');
                }, 100);
            }
        }

        new ScrollAnimator();

        // Mobile Menu Toggle
        function toggleMenu() {
            document.querySelector('.nav-links').classList.toggle('active');
        }

        // Close menu when clicking a link
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                document.querySelector('.nav-links').classList.remove('active');
            });
        });

        // Smooth scroll for nav links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });
    </script>
